[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rpc-state-indexer"
version = "0.1.0"
description = "Verified historical EVM state indexer"
requires-python = ">=3.11,<3.15"
dynamic = ["dependencies"]

[project.scripts]
rpc-state-indexer = "rpc_state_indexer.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.in"]}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a local service",
  "pinned_chain: requires archive RPC credentials",
  "performance: manual performance checks",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
